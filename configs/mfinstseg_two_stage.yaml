# MFInstSeg -- Two-Stage (Approach B): semantic CMCA, freeze, then link predictor
#
# Re-extracted MFInstSeg corpus (real adjacency, real convexity/dihedral angle,
# UV-Net unit-cube normalisation). 70/10/20 train/val/test: training stops on
# the one evaluated, and every threshold is tuned on VALIDATION.
#
# Run:
#   Stage 1: python -m src.training.train_semantic --config configs/mfinstseg_two_stage.yaml
#   Stage 2: python -m src.training.train_link     --config configs/mfinstseg_two_stage.yaml
#   Stage 2 loads the Stage 1 checkpoint named in `semantic_checkpoint` below and
#   writes its own to `paths.link_checkpoint`, so Stage 1 is not overwritten.

experiment_name: mfinstseg_two_stage
seed: 42

dataset:
  name: mfinstaseg
  json_dir: ../data/mfinstaseg/
  split_file: datasets/splits/mfinstseg_70_10_20_seed42.json
  n_classes: 25
  attributes: standardized
  norm_stats: datasets/splits/mfinstseg_norm_train.json
  one_hot_type: false

bias:
  type: both             # similarity | adjacency | both
  lambda_adj: 1.0
  lambda_sim: 1.0

model:
  type: semantic_segmentation
  version: v1
  d_model: 128
  n_heads: 8
  n_layers: 4
  dim_feedforward: 256
  dropout: 0.1

label_encoder:
  embedding_dim: 128

loss:
  type: prototype_infonce
  temperature: 0.07
  use_class_weights: false

training:
  # Early stopping on validation loss, patience 10, cap of 60 epochs.
  # The evaluated checkpoint is the one with the best validation loss.
  max_epochs: 60
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 10
  scheduler: null

semantic_checkpoint: results/checkpoints/mfinstseg_two_stage.pth

link_model:
  d_model: 128
  n_heads: 8
  n_layers: 2
  dim_feedforward: 256
  dropout: 0.1

paths:
  checkpoint: results/checkpoints/mfinstseg_two_stage.pth
  link_checkpoint: results/checkpoints/mfinstseg_two_stage_link.pth
  figures: results/figures/mfinstseg_two_stage/
