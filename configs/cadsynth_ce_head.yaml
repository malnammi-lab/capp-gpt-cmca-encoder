# CADSynth -- CROSS-ENTROPY arm of the encoder-vs-objective ablation (task 2.1).
#
# Generated from cadsynth_bias_both.yaml so the two are identical except for
# the objective. Same corpus, same split file, same seed, same architecture,
# same attribute view, same bias. Only `loss.type` differs -- which is what
# makes a gap between them attributable to the objective.
#
# Pairs with:  cadsynth_bias_both.yaml   (loss.type: prototype_infonce)
#
# Run:
#   python -m src.training.train_semantic --config configs/cadsynth_ce_head.yaml

experiment_name: cadsynth_ce_head
seed: 42

dataset:
  name: cadsynth
  # Real adjacency, real convexity and dihedral angle, UV-Net unit-cube coordinates.
  json_dir: ../data/cadsynth/
  split_file: datasets/splits/cadsynth_70_10_20_seed42.json
  n_classes: 25

  # scaled | raw | standardized
  #   scaled       faces_attr      divided by constants, clipped to [0,1]
  #   raw          faces_attr_raw  unit-cube units, unclipped
  #   standardized (raw - mean) / std, statistics from the TRAINING SPLIT only
  attributes: standardized
  norm_stats: datasets/splits/cadsynth_norm_train.json

  # Expands the ordinal type column into an 8-way indicator (4-d -> 11-d).
  # Leave false until the encoder is widened to accept 11-d attributes.
  one_hot_type: false

bias:
  type: both        # similarity | adjacency | both
  lambda_adj: 1.0        # used only when type: both
  lambda_sim: 1.0

model:
  type: semantic_segmentation
  version: v1
  d_model: 128
  n_heads: 8
  n_layers: 4
  dim_feedforward: 256
  dropout: 0.1

label_encoder:
  embedding_dim: 128

loss:
  # cross_entropy -> linear class head, no label tower (SemanticClassificationModel)
  type: cross_entropy
  temperature: 0.07
  use_class_weights: false

training:
  # Early stopping on validation loss, patience 10, cap of 60 epochs.
  # The evaluated checkpoint is the one with the best validation loss.
  max_epochs: 60
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 10
  scheduler: null

paths:
  checkpoint: results/checkpoints/cadsynth_ce_head.pth
  figures: results/figures/cadsynth_ce_head/
