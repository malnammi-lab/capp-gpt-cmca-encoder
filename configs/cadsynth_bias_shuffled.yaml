# CADSYNTH -- SHUFFLED bias: the CONTROL arm for the topology claim.
#
# Generated from the adjacency config; only `bias.type` differs. The adjacency
# matrix has its node labels permuted, so density, degree sequence, symmetry and
# zero diagonal are all preserved and only the correspondence between graph node
# and face is broken. The permutation is derived from the model id, so it is
# fixed for the whole run rather than resampled per epoch.
#
# HOW TO READ IT -- against `adjacency`, not against the best arm:
#   adjacency >> shuffled   the gain comes from topology (the paper's claim)
#   adjacency ~= shuffled   the gain is sparsity/regularisation, and the
#                           topology framing does not survive
#
# Epoch parity between an arm and its control is a
# deleted concept. Both arms now stop on their own validation loss under one
# shared rule (patience 10, cap 60, best-val checkpoint), so the comparison is
# matched by the SELECTION RULE rather than by a shared budget.
#
# Run:
#   python -m src.training.train_semantic --config configs/cadsynth_bias_shuffled.yaml

experiment_name: cadsynth_bias_shuffled
seed: 42

dataset:
  name: cadsynth
  # Real adjacency, real convexity and dihedral angle, UV-Net unit-cube coordinates.
  json_dir: ../data/cadsynth/
  split_file: datasets/splits/cadsynth_70_10_20_seed42.json
  n_classes: 25

  # scaled | raw | standardized
  #   scaled       faces_attr      divided by constants, clipped to [0,1]
  #   raw          faces_attr_raw  unit-cube units, unclipped
  #   standardized (raw - mean) / std, statistics from the TRAINING SPLIT only
  attributes: standardized
  norm_stats: datasets/splits/cadsynth_norm_train.json

  # Expands the ordinal type column into an 8-way indicator (4-d -> 11-d).
  # Leave false until the encoder is widened to accept 11-d attributes.
  one_hot_type: false

bias:
  type: shuffled           # similarity | adjacency | both | shuffled
  lambda_adj: 1.0        # used only when type: both
  lambda_sim: 1.0

model:
  type: semantic_segmentation
  version: v1
  d_model: 128
  n_heads: 8
  n_layers: 4
  dim_feedforward: 256
  dropout: 0.1

label_encoder:
  embedding_dim: 128

loss:
  type: prototype_infonce
  temperature: 0.07
  use_class_weights: false

training:
  # Early stopping on validation loss, patience 10, cap of 60 epochs.
  # The evaluated checkpoint is the one with the best validation loss.
  max_epochs: 60
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 10
  scheduler: null

paths:
  checkpoint: results/checkpoints/cadsynth_bias_shuffled.pth
  figures: results/figures/cadsynth_bias_shuffled/
