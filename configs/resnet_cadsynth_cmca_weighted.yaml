# resnet_cadsynth_cmca_weighted -- TIER T7, P3 SCOUTING. NOT FOR P2.
#
# The weighted mirror of resnet_cadsynth, run to inform P3's design (Q6-Q8), not to
# produce a number for this paper. Its outputs land under results/scouting/ so
# that a path alone tells a reader the number is outside P2 quotability:
# training-regiment.md section 2 excludes T7 from the release claim, and the
# quotability checklist in section 4 says T7 never appears in P2.
#
# IT DIFFERS FROM configs/resnet_cadsynth.yaml IN EXACTLY THREE THINGS:
#   experiment_name, loss.use_class_weights, paths
# Nothing else may ever differ, or the mirror conflates the weighting with
# whatever else changed.
#
# Run:
#   python runners/run_all.py --tier T7 --seeds 0 1 2 3 4

experiment_name: resnet_cadsynth_cmca_weighted
seed: 42

dataset:
  name: cadsynth_faces
  # A different VIEW of the same parts, not a different corpus. The ResNet
  # consumes flat per-face UV grids from *_faces.json; the Graph Transformer
  # consumes *_features.json. Both are extracted from the same 6,063 STEP files
  # by the same BRepFeatureExtractor, and both fail on the same one malformed
  # file (00006062.stp), so both cover exactly 6,062 models and 169,563 faces.
  json_dir: ../data/cadsynth_faces/
  n_classes: 25

  # The face corpus has the same 6,062 model ids as the graph arms, so
  # this config uses the graph split file. Both rows train, select, and
  # test on the same parts.
  split_file: datasets/splits/cadsynth_70_10_20_seed42.json
  # NO `norm_stats` HERE, DELIBERATELY. Every other config in configs/ carries
  # one, so its absence looks like an oversight; it is not. norm_stats is read
  # only by CMCADataset when attributes="standardized" (src/data/brep_dataset.py).
  # The ResNet cells load UVGridLabelDataset (src/data/uv_dataset.py), which
  # performs no standardisation of any kind -- the UV grids are already in unit
  # -cube coordinates. Adding norm_stats here would be silently ignored.
  # train_split and val_split are unset. The split file supplies train, val, and test.

model:
  type: resnet_encoder
  embedding_dim: 512

loss:
  type: prototype_infonce      # prototype_infonce | cross_entropy
  temperature: 0.07

  # Headline policy is unweighted. This file is the weighted CMCA cell,
  # not the T4 footnote (resnet_cadsynth_ce_weighted.yaml). It is P3
  # scouting only.
  # THE ONE SUBSTANTIVE LINE THAT DIFFERS
  # from configs/resnet_cadsynth.yaml. true on purpose: this arm exists to run
  # the OTHER class-weighting policy against an otherwise identical cell.
  use_class_weights: true

training:
  # batch_size is 128 here and 4 in the graph arms, so the shared epoch
  # cap is not the same number of gradient steps. A checkpoint that sits
  # at the cap is caught by the convergence check.
  # Early stopping on validation loss, patience 10, cap of 60 epochs.
  # The evaluated checkpoint is the one with the best validation loss.
  max_epochs: 60
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  patience: 10
  scheduler: cosine_annealing

paths:
  checkpoint: results/scouting/checkpoints/resnet_cadsynth_cmca_weighted.pth
  figures: results/scouting/figures/resnet_cadsynth_cmca_weighted/
