experiment_name: mfinstseg_unified
seed: 0
dataset:
  name: mfinstaseg
  json_dir: ../data/mfinstaseg/
  split_file: datasets/splits/mfinstseg_70_10_20_seed42.json
  n_classes: 25
  attributes: standardized
  norm_stats: datasets/splits/mfinstseg_norm_train.json
  one_hot_type: false
bias:
  type: both
  lambda_adj: 1.0
  lambda_sim: 1.0
model:
  type: brep_encoder
  version: v1
  d_model: 128
  n_heads: 8
  n_layers: 4
  dim_feedforward: 256
  dropout: 0.1
label_encoder:
  embedding_dim: 128
loss:
  temperature: 0.07
  hard_mining_ratio: 0.3
  weights:
    semantic: 1.0
    bottom: 1.0
    instance: 1.0
training:
  max_epochs: 60
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 10
  scheduler: null
paths:
  checkpoint: results/mfinstseg_unified/seed0/checkpoint.pth
  figures: results/mfinstseg_unified/seed0/
