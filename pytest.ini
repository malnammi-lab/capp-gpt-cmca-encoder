[pytest]
# Run from the repository root:  pytest -q
#
# conftest.py puts the repo root on sys.path, so `src.*` imports resolve without
# installing the package or setting PYTHONPATH.
#
# Tests needing pythonocc-core skip automatically -- the suite is meant to run in
# the MODEL environment (env-model.yml), which deliberately has no OCC. To
# exercise the extractor tiers as well, run it under env-extraction.yml too:
#     conda run -n pyoccenv python -m pytest tests/test_extractor.py -q

testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers -ra
filterwarnings =
    ignore::DeprecationWarning
